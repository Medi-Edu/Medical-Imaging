<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>Discussion and Feedback</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000;
    }
    .container {
      width: 650px;
      margin: 50px auto;
    }
    h1 {
      text-align: center;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #aaa;
      font-size: 14px;
    }
    textarea {
      height: 90px;
    }
    hr {
      margin: 25px 0;
      border: none;
      border-top: 1px solid #ccc;
    }
    button {
      margin-top: 25px;
      padding: 10px 25px;
      background-color: #7f8a93;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="../index.html">← Back to Home</a>

    <h1>Feedback</h1>
    <p>
      Please share your experience with the course and the ALIVE (Avatar-Lecture
      Interactive Video Engine) system. Honest and thoughtful feedback is appreciated.
    </p>

    <form action="https://formspree.io/f/xjgygrkj" method="POST">

      <label>Name (Required)</label>
      <input type="text" name="Name" required>

      <!-- <label>Email (Required)</label>
      <input type="email" name="Email" required> -->

      <label>Email (Required — RPI Email)</label>
      <input
        type="email"
        name="Email"
        required
        pattern="^[A-Za-z0-9._%+-]+@rpi\.edu$"
        title="Please use your RPI email address (@rpi.edu)"
      >


      <!-- <label>RIN (Required)</label>
      <input type="text" name="RIN" required> -->

      <label>RIN (Required)</label>
      <input
        type="text"
        name="RIN"
        required
        pattern="^66[0-9]{7}$"
        title="RIN must be 9 digits and start with 66"
      >

      <hr>

      <label>
        1. In what situations did you use ALIVE?
      </label>
      <textarea name="ALIVE_Usage"></textarea>

      <label>
        2. Describe one interaction that was particularly helpful, and explain why.
      </label>
      <textarea name="ALIVE_Helpful"></textarea>

      <label>
        3. Describe one interaction that was confusing, unhelpful, or disappointing.
      </label>
      <textarea name="ALIVE_Confusing"></textarea>

      <label>
        4. Compared with traditional videos or lectures, how did ALIVE feel at this stage of the course?
      </label>
      <textarea name="ALIVE_Comparison"></textarea>

      <input type="hidden" name="Course" value="Biomedical Instrumentation and Imaging">
      <input type="hidden" name="System" value="ALIVE">

      <button type="submit">Submit Feedback</button>
    </form>

  </div>

</body>
</html>
