<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Avatar Lecture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h2 id="lectureTitle">Loading lecture…</h2>

  <!-- Lecture video -->
  <video id="lectureVideo" controls style="width:100%; max-width:900px;"></video>

  <hr />

  <!-- Question box -->
  <textarea
    id="questionBox"
    rows="4"
    style="width:100%; max-width:900px;"
    placeholder="Ask a question about this lecture…"
  ></textarea>

  <br /><br />
  <button id="askBtn">Ask Avatar</button>

  <p id="status"></p>

  <!-- Avatar response -->
  <video
    id="avatarVideo"
    controls
    style="display:none; width:100%; max-width:512px;"
  ></video>

  <script src="interactive_avatar.js"></script>
</body>
</html>
